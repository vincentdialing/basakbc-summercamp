<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBC Summer Youth Camp Admin Hub</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-page admin-dashboard-page">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="header-brand-group">
        <a class="brand-lockup" href="./index.html" aria-label="Return to Basak Baptist Church Summer Youth Camp home">
          <img src="assets/church-logo.svg" alt="Basak Baptist Church official logo">
          <div>
            <strong>Basak Baptist Church</strong>
            <span>Admin Hub</span>
          </div>
        </a>
        <button class="music-toggle admin-header-spacer" type="button" aria-hidden="true" tabindex="-1">
          <svg class="music-toggle-on" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <svg class="music-toggle-off" viewBox="0 0 24 24" aria-hidden="true"></svg>
        </button>
      </div>
      <nav class="top-nav" aria-label="Primary">
        <a class="is-active" href="./admin-dashboard.html" aria-current="page">Hub</a>
        <a href="./admin-table.html">Table</a>
        <a href="./admin-wheel.html">Wheel</a>
        <a href="./admin-teams.html">Teams</a>
        <a href="./admin-certificates.html">Certificates</a>
        <button class="admin-top-exit" id="admin-logout" type="button">Exit</button>
      </nav>
    </div>
  </header>

  <main class="admin-shell">
    <section class="admin-dashboard card">
      <section class="admin-landing-display" aria-label="Delegate summary">
        <h1 class="admin-kicker">Total Delegates</h1>
        <strong class="admin-landing-count" id="admin-total-delegates">0</strong>
        <p class="admin-landing-date" id="admin-current-date">Loading date...</p>
        <p class="admin-landing-time" id="admin-current-time">Loading time...</p>
        <p class="admin-status" id="admin-status">Loading...</p>
      </section>
    </section>
  </main>

  <script type="module" src="admin-dashboard.js"></script>
</body>

</html>
